name: CI

on:
  push:
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pipeline image
        run: docker build -t tucbs-building .

      - name: Run CityGML -> CityJSON -> 3D Tiles pipeline
        run: |
          mkdir -p out/cityjson out/3dtiles
          docker run --rm \
            -v "$(pwd)/out/cityjson:/app/data/cityjson" \
            -v "$(pwd)/out/3dtiles:/app/data/3dtiles" \
            tucbs-building

      - name: Check CityJSON output (cjio info)
        run: |
          for f in out/cityjson/*.json; do
            echo "=== $f ==="
            docker run --rm -v "$(pwd)/out/cityjson:/data" tucbs-building \
              cjio "/data/$(basename "$f")" info
          done

      - name: Check 3D Tiles output
        run: |
          test -f out/3dtiles/tileset.json
          n_expected=$(ls data/raw | wc -l)
          n_glb=$(find out/3dtiles -name '*.glb' | wc -l)
          n_children=$(jq '.root.children | length' out/3dtiles/tileset.json)
          echo "expected buildings: $n_expected, .glb files: $n_glb, tileset children: $n_children"
          [ "$n_glb" -eq "$n_expected" ]
          [ "$n_children" -eq "$n_expected" ]
